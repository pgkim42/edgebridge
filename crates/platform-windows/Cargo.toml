[package]
name = "edgebridge-platform-windows"
description = "EdgeBridge Windows backend: low-level hooks, Raw Input, input suppression"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# FFI crate이므로 workspace의 unsafe_code=deny를 상속하지 않는다. 이식 가능한 모델/정규화/큐는
# 모든 target에서 컴파일되어 Mac에서도 테스트되고, Win32 backend만 windows target에서 컴파일된다.
[dependencies]

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Input",
    "Win32_UI_WindowsAndMessaging",
] }
